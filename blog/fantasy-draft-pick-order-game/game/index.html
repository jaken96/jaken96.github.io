<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A fantasy football draft-order game powered by Disney and NFL trivia."

    <title>Fantasy Football &amp; Disney Trivia</title>
    <link rel="stylesheet" href="styles.css">

  <body class="landing-page">
    <main class="landing-shell">
      <div class="eyebrow">Draft night starts here</div>

      <section class="hero-card" aria-labelledby="game-title">
        <div class="hero-art" aria-hidden="true">
          <span class="hero-star">★</span>
          <span class="hero-football">◆</span>
        </div>

        <p class="hero-kicker">Eight players. Two worlds. One draft order.</p>
        <h1 id="game-title">
          Fantasy Football
          <span>&amp; Disney Trivia</span>
        </h1>
        <p class="hero-copy">
          Buzz in, answer correctly, and race to claim your fantasy draft
          position.
        </p>

        <a class="button button-primary button-large" href="disney.html">
          Start Game
          <span aria-hidden="true">→</span>
        </a>

        <div class="category-links" aria-label="Start with a category">
          <a href="disney.html">Start with Disney</a>
          <span aria-hidden="true">•</span>
          <a href="nfl.html">Start with NFL</a>
        </div>
      </section>

      <p class="landing-note">255 source-backed questions ready to play</p>
    </main>
  </body>
</html>
